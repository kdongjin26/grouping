<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>조 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2c2933;
    --ink-soft: #6b6675;
    --line: #e7e2ec;
    --card: #ffffff;
    --bg: #faf7f3;
    --shadow: 0 6px 20px rgba(80, 70, 100, 0.08);
    --shadow-soft: 0 2px 8px rgba(80, 70, 100, 0.05);

    /* 조금 더 차분한 더스티 파스텔 */
    --g1-bg: #f4d3d8; --g1-ink: #5a3138; --g1-bd: #e3b6bd;
    --g2-bg: #cfdfe8; --g2-ink: #2b4658; --g2-bd: #aec5d3;
    --g3-bg: #d3e3d4; --g3-ink: #2f4f3a; --g3-bd: #b3cdb6;
    --g4-bg: #f0e3c0; --g4-ink: #5d4a1e; --g4-bd: #d8c79b;
    --g5-bg: #d9d2e6; --g5-ink: #3e3358; --g5-bd: #bcb1d0;
    --g6-bg: #ecd5c2; --g6-ink: #5d3d24; --g6-bd: #d4b69d;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Gowun Dodum', system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: var(--bg);
    background-image:
      radial-gradient(circle at 18% 12%, #f5e6e9 0%, transparent 40%),
      radial-gradient(circle at 82% 18%, #e3ebf3 0%, transparent 42%),
      radial-gradient(circle at 50% 96%, #e8eee2 0%, transparent 48%);
    min-height: 100vh;
    padding: 36px 24px 64px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1040px; margin: 0 auto; }

  header.title {
    text-align: center;
    margin-bottom: 28px;
  }
  h1 {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 32px;
    margin: 0 0 8px;
    color: var(--ink);
    letter-spacing: 1.5px;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0;
    letter-spacing: 0.5px;
  }

  /* 학생 명단 */
  section.roster {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px 22px 22px;
    box-shadow: var(--shadow-soft);
    margin: 20px 0;
  }
  .section-title {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 0.5px;
  }
  .section-title .pill {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 12px;
    background: #f3eee8;
    color: var(--ink-soft);
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 400;
    letter-spacing: 0;
  }
  .roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(98px, 1fr));
    gap: 8px;
  }
  .stu {
    background: #fbf8f4;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
    transition: transform 200ms ease, box-shadow 200ms ease;
    user-select: none;
  }
  .stu .num {
    display: inline-block;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .stu .name {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.3px;
  }
  .stu.shaking {
    animation: sway 350ms ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: translate(0,0); }
    50% { transform: translate(0, -2px); }
  }

  /* 뽑기 버튼 */
  .draw-area {
    text-align: center;
    margin: 30px 0 24px;
  }
  button.draw-btn {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 17px;
    color: #ffffff;
    background: #6f5c7a;
    border: none;
    border-radius: 999px;
    padding: 14px 42px;
    cursor: pointer;
    box-shadow: var(--shadow);
    letter-spacing: 3px;
    transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
  }
  button.draw-btn:hover { background: #5d4c68; transform: translateY(-1px); }
  button.draw-btn:active { transform: translateY(1px); }
  button.draw-btn:disabled {
    background: #b0a8b8;
    cursor: not-allowed;
    transform: none;
  }

  .ddoogu {
    margin-top: 14px;
    min-height: 22px;
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 6px;
    opacity: 0;
    transition: opacity 200ms ease;
  }
  .ddoogu.show { opacity: 1; }

  /* 결과 영역 */
  section.results {
    margin-top: 8px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
  }
  .group-card {
    border-radius: 14px;
    padding: 18px 20px 20px;
    box-shadow: var(--shadow-soft);
    border: 1px solid;
    background: var(--card);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 400ms ease, transform 400ms ease;
  }
  .group-card.shown { opacity: 1; transform: translateY(0); }
  .group-card .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .group-card .head h2 {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 18px;
    margin: 0;
    letter-spacing: 2px;
  }
  .group-card .head .count {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.5px;
    opacity: 0.7;
  }
  .members {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .member {
    background: rgba(255,255,255,0.6);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.3px;
  }
  .member .mnum {
    display: inline-block;
    font-size: 11px;
    font-weight: 400;
    opacity: 0.5;
    margin-right: 5px;
  }

  .group-1 { background: var(--g1-bg); border-color: var(--g1-bd); }
  .group-1 h2, .group-1 .count, .group-1 .member { color: var(--g1-ink); }

  .group-2 { background: var(--g2-bg); border-color: var(--g2-bd); }
  .group-2 h2, .group-2 .count, .group-2 .member { color: var(--g2-ink); }

  .group-3 { background: var(--g3-bg); border-color: var(--g3-bd); }
  .group-3 h2, .group-3 .count, .group-3 .member { color: var(--g3-ink); }

  .group-4 { background: var(--g4-bg); border-color: var(--g4-bd); }
  .group-4 h2, .group-4 .count, .group-4 .member { color: var(--g4-ink); }

  .group-5 { background: var(--g5-bg); border-color: var(--g5-bd); }
  .group-5 h2, .group-5 .count, .group-5 .member { color: var(--g5-ink); }

  .group-6 { background: var(--g6-bg); border-color: var(--g6-bd); }
  .group-6 h2, .group-6 .count, .group-6 .member { color: var(--g6-ink); }

  @media (max-width: 540px) {
    h1 { font-size: 26px; }
    button.draw-btn { font-size: 15px; padding: 13px 32px; }
    .members { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="title">
    <h1>조 뽑 기</h1>
    <p class="subtitle">25명을 5개 조로 나눕니다</p>
  </header>

  <section class="roster">
    <h2 class="section-title">학생 명단 <span class="pill">총 25명</span></h2>
    <div class="roster-grid" id="rosterGrid"></div>
  </section>

  <div class="draw-area">
    <button class="draw-btn" id="drawBtn">뽑 기</button>
    <div class="ddoogu" id="ddoogu" aria-hidden="true">두구두구두구</div>
  </div>

  <section class="results" id="results"></section>
</div>

<script>
  const STUDENTS = [
    { n:1,  name:'고세현', g:'남', y:24, dept:'일사' },
    { n:2,  name:'김대영', g:'남', y:22, dept:'일사' },
    { n:3,  name:'김민서', g:'여', y:23, dept:'일사' },
    { n:4,  name:'김재희', g:'여', y:23, dept:'교육' },
    { n:5,  name:'김주은', g:'여', y:24, dept:'일사' },
    { n:6,  name:'김주혜', g:'여', y:24, dept:'한문' },
    { n:7,  name:'김지형', g:'남', y:22, dept:'일사' },
    { n:8,  name:'김하진', g:'여', y:24, dept:'일사' },
    { n:9,  name:'김하현', g:'여', y:24, dept:'일사' },
    { n:10, name:'박선재', g:'남', y:24, dept:'일사' },
    { n:11, name:'박효진', g:'여', y:24, dept:'교육' },
    { n:12, name:'배성지', g:'여', y:23, dept:'일사' },
    { n:13, name:'서의현', g:'남', y:24, dept:'일사' },
    { n:14, name:'심예은', g:'여', y:24, dept:'일사' },
    { n:15, name:'오창현', g:'남', y:22, dept:'일사' },
    { n:16, name:'이가현', g:'여', y:23, dept:'일사' },
    { n:17, name:'이승섭', g:'남', y:22, dept:'일사' },
    { n:18, name:'이재혁', g:'남', y:22, dept:'윤리' },
    { n:19, name:'이정현', g:'남', y:22, dept:'일사' },
    { n:20, name:'이지현', g:'여', y:24, dept:'일사' },
    { n:21, name:'이해진', g:'여', y:24, dept:'일사' },
    { n:22, name:'이현서', g:'여', y:24, dept:'일사' },
    { n:23, name:'최인선', g:'여', y:23, dept:'한문' },
    { n:24, name:'최정현', g:'남', y:22, dept:'일사' },
    { n:25, name:'홍민하', g:'남', y:22, dept:'일사' },
  ];
  const GROUP_SIZES = [5, 5, 5, 5, 5];
  const NUM_GROUPS = GROUP_SIZES.length;

  const rosterGrid = document.getElementById('rosterGrid');
  STUDENTS.forEach(s => {
    const el = document.createElement('div');
    el.className = 'stu';
    el.dataset.n = s.n;
    el.innerHTML = `<div class="num">${s.n}</div><div class="name">${s.name}</div>`;
    rosterGrid.appendChild(el);
  });

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function distribute() {
    const nonIlsa = STUDENTS.filter(s => s.dept !== '일사');
    const ilsa    = STUDENTS.filter(s => s.dept === '일사');

    for (let attempt = 0; attempt < 4000; attempt++) {
      const sNon = shuffle(nonIlsa);
      const sIl  = shuffle(ilsa);
      const groups = Array.from({ length: NUM_GROUPS }, () => []);
      const order = shuffle(groups.map((_, i) => i));
      const seed = Math.min(sNon.length, NUM_GROUPS);
      for (let i = 0; i < seed; i++) groups[order[i]].push(sNon[i]);
      for (let i = seed; i < sNon.length; i++) sIl.push(sNon[i]);

      let ok = true;
      for (const s of sIl) {
        const cands = [];
        for (let g = 0; g < NUM_GROUPS; g++) if (groups[g].length < GROUP_SIZES[g]) cands.push(g);
        if (cands.length === 0) { ok = false; break; }
        const pick = cands[Math.floor(Math.random() * cands.length)];
        groups[pick].push(s);
      }
      if (!ok) continue;

      let valid = true;
      for (const grp of groups) {
        const males = grp.filter(s => s.g === '남').length;
        const females = grp.filter(s => s.g === '여').length;
        const non24 = grp.filter(s => s.y !== 24).length;
        if (males === 0 || females === 0 || non24 === 0) { valid = false; break; }
      }
      if (valid) return groups;
    }

    const all = shuffle(STUDENTS);
    const groups = Array.from({ length: NUM_GROUPS }, () => []);
    let idx = 0;
    for (let g = 0; g < NUM_GROUPS; g++) {
      for (let k = 0; k < GROUP_SIZES[g]; k++) groups[g].push(all[idx++]);
    }
    return groups;
  }

  const resultsEl = document.getElementById('results');
  function renderResults(groups) {
    resultsEl.innerHTML = '';
    groups.forEach((grp, i) => {
      const card = document.createElement('div');
      card.className = `group-card group-${i + 1}`;
      const sorted = grp.slice().sort((a, b) => a.n - b.n);
      const membersHtml = sorted.map(s =>
        `<div class="member"><span class="mnum">${s.n}</span>${s.name}</div>`
      ).join('');
      card.innerHTML = `
        <div class="head">
          <h2>${i + 1}조</h2>
          <span class="count">${grp.length}명</span>
        </div>
        <div class="members">${membersHtml}</div>
      `;
      resultsEl.appendChild(card);
      setTimeout(() => card.classList.add('shown'), 100 + i * 90);
    });
  }

  const drawBtn = document.getElementById('drawBtn');
  const ddoogu  = document.getElementById('ddoogu');

  drawBtn.addEventListener('click', () => {
    drawBtn.disabled = true;
    drawBtn.textContent = '뽑는 중';
    ddoogu.classList.add('show');

    const stuEls = Array.from(document.querySelectorAll('.stu'));
    stuEls.forEach(el => el.classList.add('shaking'));
    const namePool = STUDENTS.map(s => s.name);
    const nameTimer = setInterval(() => {
      stuEls.forEach(el => {
        const r = namePool[Math.floor(Math.random() * namePool.length)];
        el.querySelector('.name').textContent = r;
      });
    }, 100);

    resultsEl.innerHTML = '';

    setTimeout(() => {
      clearInterval(nameTimer);
      stuEls.forEach(el => {
        el.classList.remove('shaking');
        const n = parseInt(el.dataset.n, 10);
        const s = STUDENTS.find(x => x.n === n);
        el.querySelector('.name').textContent = s.name;
      });
      ddoogu.classList.remove('show');

      const groups = distribute();
      renderResults(groups);

      drawBtn.disabled = false;
      drawBtn.textContent = '다시 뽑기';
    }, 2200);
  });
</script>
</body>
</html>
