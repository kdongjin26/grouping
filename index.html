<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>조 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2c2933;
    --ink-soft: #6b6675;
    --line: #e7e2ec;
    --card: #ffffff;
    --bg: #faf7f3;
    --shadow: 0 6px 20px rgba(80, 70, 100, 0.08);
    --shadow-soft: 0 2px 8px rgba(80, 70, 100, 0.05);

    /* 조금 더 차분한 더스티 파스텔 */
    --g1-bg: #f4d3d8; --g1-ink: #5a3138; --g1-bd: #e3b6bd;
    --g2-bg: #cfdfe8; --g2-ink: #2b4658; --g2-bd: #aec5d3;
    --g3-bg: #d3e3d4; --g3-ink: #2f4f3a; --g3-bd: #b3cdb6;
    --g4-bg: #f0e3c0; --g4-ink: #5d4a1e; --g4-bd: #d8c79b;
    --g5-bg: #d9d2e6; --g5-ink: #3e3358; --g5-bd: #bcb1d0;
    --g6-bg: #ecd5c2; --g6-ink: #5d3d24; --g6-bd: #d4b69d;
    --g7-bg: #cfe4e1; --g7-ink: #24504b; --g7-bd: #abcbc6;
    --g8-bg: #e9d3e3; --g8-ink: #563050; --g8-bd: #d2b2c9;
    --g9-bg: #dcdfc9; --g9-ink: #44482a; --g9-bd: #c1c6a6;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Gowun Dodum', system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: var(--bg);
    background-image:
      radial-gradient(circle at 18% 12%, #f5e6e9 0%, transparent 40%),
      radial-gradient(circle at 82% 18%, #e3ebf3 0%, transparent 42%),
      radial-gradient(circle at 50% 96%, #e8eee2 0%, transparent 48%);
    min-height: 100vh;
    padding: 36px 24px 64px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1040px; margin: 0 auto; }

  header.title {
    text-align: center;
    margin-bottom: 28px;
  }
  h1 {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 32px;
    margin: 0 0 8px;
    color: var(--ink);
    letter-spacing: 1.5px;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0;
    letter-spacing: 0.5px;
  }

  /* 학생 명단 */
  section.roster {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px 22px 22px;
    box-shadow: var(--shadow-soft);
    margin: 20px 0;
  }
  .section-title {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 0.5px;
  }
  .section-title .pill {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 12px;
    background: #f3eee8;
    color: var(--ink-soft);
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 400;
    letter-spacing: 0;
  }
  .roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(98px, 1fr));
    gap: 8px;
  }
  .stu {
    background: #fbf8f4;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
    transition: transform 200ms ease, box-shadow 200ms ease;
    user-select: none;
  }
  .stu .num {
    display: inline-block;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .stu .name {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.3px;
  }
  .stu { cursor: pointer; position: relative; }
  .stu:hover { box-shadow: var(--shadow-soft); }
  .stu.excluded {
    background: transparent;
    border-style: dashed;
    opacity: 0.45;
  }
  .stu.excluded .name { text-decoration: line-through; font-weight: 400; }
  .stu.excluded::after {
    content: '제외';
    position: absolute;
    top: 5px; right: 6px;
    font-size: 10px;
    color: var(--ink-soft);
  }
  .locked .stu { cursor: default; }
  .roster-hint {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 12px 0 0;
  }
  .roster-hint button {
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-soft);
    background: none;
    border: none;
    padding: 0;
    margin-left: 8px;
    text-decoration: underline;
    cursor: pointer;
  }

  /* 조별 최대 인원 */
  section.settings {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px 14px;
    margin: 24px 0 0;
  }
  .settings .label {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
  }
  .size-opts {
    display: inline-flex;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    box-shadow: var(--shadow-soft);
  }
  .size-opts button {
    font-family: inherit;
    font-size: 15px;
    color: var(--ink-soft);
    background: none;
    border: none;
    border-radius: 999px;
    padding: 7px 16px;
    cursor: pointer;
  }
  .size-opts button[aria-pressed="true"] {
    background: #6f5c7a;
    color: #fff;
  }
  .size-opts button:disabled { cursor: not-allowed; }
  .plan {
    font-size: 14px;
    color: var(--ink-soft);
    flex-basis: 100%;
    text-align: center;
  }

  .excluded-note {
    grid-column: 1 / -1;
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 4px;
  }

  .stu.shaking {
    animation: sway 350ms ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: translate(0,0); }
    50% { transform: translate(0, -2px); }
  }

  /* 뽑기 버튼 */
  .draw-area {
    text-align: center;
    margin: 30px 0 24px;
  }
  button.draw-btn {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 17px;
    color: #ffffff;
    background: #6f5c7a;
    border: none;
    border-radius: 999px;
    padding: 14px 42px;
    cursor: pointer;
    box-shadow: var(--shadow);
    letter-spacing: 3px;
    transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
  }
  button.draw-btn:hover { background: #5d4c68; transform: translateY(-1px); }
  button.draw-btn:active { transform: translateY(1px); }
  button.draw-btn:disabled {
    background: #b0a8b8;
    cursor: not-allowed;
    transform: none;
  }

  .ddoogu {
    margin-top: 14px;
    min-height: 22px;
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 6px;
    opacity: 0;
    transition: opacity 200ms ease;
  }
  .ddoogu.show { opacity: 1; }

  /* 결과 영역 */
  section.results {
    margin-top: 8px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
  }
  .group-card {
    border-radius: 14px;
    padding: 18px 20px 20px;
    box-shadow: var(--shadow-soft);
    border: 1px solid;
    background: var(--card);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 400ms ease, transform 400ms ease;
  }
  .group-card.shown { opacity: 1; transform: translateY(0); }
  .group-card .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .group-card .head h2 {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 18px;
    margin: 0;
    letter-spacing: 2px;
  }
  .group-card .head .count {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.5px;
    opacity: 0.7;
  }
  .members {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .member {
    background: rgba(255,255,255,0.6);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.3px;
  }
  .member .mnum {
    display: inline-block;
    font-size: 11px;
    font-weight: 400;
    opacity: 0.5;
    margin-right: 5px;
  }

  .group-1 { background: var(--g1-bg); border-color: var(--g1-bd); }
  .group-1 h2, .group-1 .count, .group-1 .member { color: var(--g1-ink); }

  .group-2 { background: var(--g2-bg); border-color: var(--g2-bd); }
  .group-2 h2, .group-2 .count, .group-2 .member { color: var(--g2-ink); }

  .group-3 { background: var(--g3-bg); border-color: var(--g3-bd); }
  .group-3 h2, .group-3 .count, .group-3 .member { color: var(--g3-ink); }

  .group-4 { background: var(--g4-bg); border-color: var(--g4-bd); }
  .group-4 h2, .group-4 .count, .group-4 .member { color: var(--g4-ink); }

  .group-5 { background: var(--g5-bg); border-color: var(--g5-bd); }
  .group-5 h2, .group-5 .count, .group-5 .member { color: var(--g5-ink); }

  .group-6 { background: var(--g6-bg); border-color: var(--g6-bd); }
  .group-6 h2, .group-6 .count, .group-6 .member { color: var(--g6-ink); }

  .group-7 { background: var(--g7-bg); border-color: var(--g7-bd); }
  .group-7 h2, .group-7 .count, .group-7 .member { color: var(--g7-ink); }

  .group-8 { background: var(--g8-bg); border-color: var(--g8-bd); }
  .group-8 h2, .group-8 .count, .group-8 .member { color: var(--g8-ink); }

  .group-9 { background: var(--g9-bg); border-color: var(--g9-bd); }
  .group-9 h2, .group-9 .count, .group-9 .member { color: var(--g9-ink); }

  @media (max-width: 540px) {
    h1 { font-size: 26px; }
    button.draw-btn { font-size: 15px; padding: 13px 32px; }
    .members { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="title">
    <h1>조 뽑 기</h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <section class="roster">
    <h2 class="section-title">학생 명단 <span class="pill" id="countPill"></span></h2>
    <div class="roster-grid" id="rosterGrid"></div>
    <p class="roster-hint">이름을 누르면 조 편성에서 제외됩니다. 다시 누르면 포함됩니다.<button type="button" id="resetExcl" hidden>모두 포함</button></p>
  </section>

  <section class="settings">
    <span class="label">조별 최대 인원</span>
    <div class="size-opts" id="sizeOpts" role="group" aria-label="조별 최대 인원">
      <button type="button" data-max="3">3명</button>
      <button type="button" data-max="4">4명</button>
      <button type="button" data-max="5">5명</button>
      <button type="button" data-max="6">6명</button>
    </div>
    <div class="plan" id="plan"></div>
  </section>

  <div class="draw-area">
    <button class="draw-btn" id="drawBtn">뽑 기</button>
    <div class="ddoogu" id="ddoogu" aria-hidden="true">두구두구두구</div>
  </div>

  <section class="results" id="results"></section>
</div>

<script>
  const STUDENTS = [
    { n:1,  name:'고세현', g:'남', y:24, dept:'일사' },
    { n:2,  name:'김대영', g:'남', y:22, dept:'일사' },
    { n:3,  name:'김민서', g:'여', y:23, dept:'일사' },
    { n:4,  name:'김재희', g:'여', y:23, dept:'교육' },
    { n:5,  name:'김주은', g:'여', y:24, dept:'일사' },
    { n:6,  name:'김주혜', g:'여', y:24, dept:'한문' },
    { n:7,  name:'김지형', g:'남', y:22, dept:'일사' },
    { n:8,  name:'김하진', g:'여', y:24, dept:'일사' },
    { n:9,  name:'김하현', g:'여', y:24, dept:'일사' },
    { n:10, name:'박선재', g:'남', y:24, dept:'일사' },
    { n:11, name:'박효진', g:'여', y:24, dept:'교육' },
    { n:12, name:'배성지', g:'여', y:23, dept:'일사' },
    { n:13, name:'서의현', g:'남', y:24, dept:'일사' },
    { n:14, name:'심예은', g:'여', y:24, dept:'일사' },
    { n:15, name:'오창현', g:'남', y:22, dept:'일사' },
    { n:16, name:'이가현', g:'여', y:23, dept:'일사' },
    { n:17, name:'이승섭', g:'남', y:22, dept:'일사' },
    { n:18, name:'이재혁', g:'남', y:22, dept:'윤리' },
    { n:19, name:'이정현', g:'남', y:22, dept:'일사' },
    { n:20, name:'이지현', g:'여', y:24, dept:'일사' },
    { n:21, name:'이해진', g:'여', y:24, dept:'일사' },
    { n:22, name:'이현서', g:'여', y:24, dept:'일사' },
    { n:23, name:'최인선', g:'여', y:23, dept:'한문' },
    { n:24, name:'최정현', g:'남', y:22, dept:'일사' },
    { n:25, name:'홍민하', g:'남', y:22, dept:'일사' },
  ];
  const NUM_COLORS = 9;
  let maxSize = 5;
  const excluded = new Set();
  let drawing = false;

  function activeStudents() {
    return STUDENTS.filter(s => !excluded.has(s.n));
  }

  // 최대 인원 이하가 되도록 조 개수를 정하고, 인원은 최대한 고르게 나눈다
  function planSizes(n, max) {
    if (n === 0) return [];
    const k = Math.ceil(n / max);
    const base = Math.floor(n / k), rem = n % k;
    return Array.from({ length: k }, (_, i) => base + (i < rem ? 1 : 0));
  }

  const rosterGrid = document.getElementById('rosterGrid');
  STUDENTS.forEach(s => {
    const el = document.createElement('div');
    el.className = 'stu';
    el.dataset.n = s.n;
    el.innerHTML = `<div class="num">${s.n}</div><div class="name">${s.name}</div>`;
    el.addEventListener('click', () => {
      if (drawing) return;
      if (excluded.has(s.n)) excluded.delete(s.n); else excluded.add(s.n);
      el.classList.toggle('excluded', excluded.has(s.n));
      settingsChanged();
    });
    rosterGrid.appendChild(el);
  });

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 조건: 남·여 각 1명 이상, 22·23학번 1명 이상, 비-일사 1명 이상
  // 조가 많아 다 채울 수 없으면 어긋남이 가장 적은 편성을 고른다
  function lacks(grp) {
    return {
      m:   !grp.some(s => s.g === '남'),
      f:   !grp.some(s => s.g === '여'),
      y:   !grp.some(s => s.y !== 24),
      dep: !grp.some(s => s.dept !== '일사'),
    };
  }
  function violations(groups) {
    let v = 0;
    for (const grp of groups) {
      const l = lacks(grp);
      v += l.m + l.f + l.y + l.dep;
    }
    return v;
  }
  function gain(grp, s) {
    const l = lacks(grp);
    return (l.m && s.g === '남') + (l.f && s.g === '여') + (l.y && s.y !== 24) + (l.dep && s.dept !== '일사');
  }

  function distribute(pool, sizes) {
    const numGroups = sizes.length;
    let best = null, bestV = Infinity;

    for (let attempt = 0; attempt < 4000; attempt++) {
      const order = shuffle(pool.filter(s => s.dept !== '일사'))
        .concat(shuffle(pool.filter(s => s.dept === '일사')));
      const groups = Array.from({ length: numGroups }, () => []);

      // 자리 남은 조 중 부족한 조건을 가장 많이 채우는 조에 넣는다(동점이면 무작위)
      for (const s of order) {
        let top = -1, cands = [];
        for (let g = 0; g < numGroups; g++) {
          if (groups[g].length >= sizes[g]) continue;
          const v = gain(groups[g], s);
          if (v > top) { top = v; cands = [g]; }
          else if (v === top) cands.push(g);
        }
        groups[cands[Math.floor(Math.random() * cands.length)]].push(s);
      }

      const v = violations(groups);
      if (v < bestV) { best = groups; bestV = v; }
      if (v === 0) break;
    }
    return shuffle(best);
  }

  const resultsEl = document.getElementById('results');
  function renderResults(groups) {
    resultsEl.innerHTML = '';
    groups.forEach((grp, i) => {
      const card = document.createElement('div');
      card.className = `group-card group-${(i % NUM_COLORS) + 1}`;
      const sorted = grp.slice().sort((a, b) => a.n - b.n);
      const membersHtml = sorted.map(s =>
        `<div class="member"><span class="mnum">${s.n}</span>${s.name}</div>`
      ).join('');
      card.innerHTML = `
        <div class="head">
          <h2>${i + 1}조</h2>
          <span class="count">${grp.length}명</span>
        </div>
        <div class="members">${membersHtml}</div>
      `;
      resultsEl.appendChild(card);
      setTimeout(() => card.classList.add('shown'), 100 + i * 90);
    });
    if (excluded.size) {
      const note = document.createElement('p');
      note.className = 'excluded-note';
      note.textContent = '제외: ' + STUDENTS.filter(s => excluded.has(s.n)).map(s => s.name).join(', ');
      resultsEl.appendChild(note);
    }
  }

  const drawBtn   = document.getElementById('drawBtn');
  const ddoogu    = document.getElementById('ddoogu');
  const subtitle  = document.getElementById('subtitle');
  const countPill = document.getElementById('countPill');
  const planEl    = document.getElementById('plan');
  const resetExcl = document.getElementById('resetExcl');
  const sizeBtns  = Array.from(document.querySelectorAll('#sizeOpts button'));

  function describePlan(sizes) {
    const counts = {};
    sizes.forEach(n => { counts[n] = (counts[n] || 0) + 1; });
    return Object.keys(counts).sort((a, b) => b - a)
      .map(n => `${n}명 ${counts[n]}개 조`).join(' · ');
  }

  function updateHeader() {
    const n = activeStudents().length;
    const sizes = planSizes(n, maxSize);
    countPill.textContent = excluded.size ? `${n}명 · 제외 ${excluded.size}명` : `총 ${n}명`;
    subtitle.textContent = n ? `${n}명을 ${sizes.length}개 조로 나눕니다` : '편성할 학생이 없습니다';
    planEl.textContent = n ? `→ ${sizes.length}개 조 (${describePlan(sizes)})` : '';
    sizeBtns.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.max === maxSize)));
    resetExcl.hidden = excluded.size === 0;
    drawBtn.disabled = n === 0;
  }

  // 인원·제외가 바뀌면 이전 결과는 맞지 않으므로 지운다
  function settingsChanged() {
    resultsEl.innerHTML = '';
    drawBtn.textContent = '뽑 기';
    updateHeader();
  }

  sizeBtns.forEach(b => b.addEventListener('click', () => {
    if (drawing) return;
    maxSize = +b.dataset.max;
    settingsChanged();
  }));

  resetExcl.addEventListener('click', () => {
    if (drawing) return;
    excluded.clear();
    document.querySelectorAll('.stu.excluded').forEach(el => el.classList.remove('excluded'));
    settingsChanged();
  });

  function setDrawing(on) {
    drawing = on;
    rosterGrid.classList.toggle('locked', on);
    sizeBtns.forEach(b => { b.disabled = on; });
    resetExcl.disabled = on;
  }

  drawBtn.addEventListener('click', () => {
    const pool = activeStudents();
    if (!pool.length) return;
    setDrawing(true);
    drawBtn.disabled = true;
    drawBtn.textContent = '뽑는 중';
    ddoogu.classList.add('show');

    const stuEls = Array.from(document.querySelectorAll('.stu:not(.excluded)'));
    stuEls.forEach(el => el.classList.add('shaking'));
    const namePool = pool.map(s => s.name);
    const nameTimer = setInterval(() => {
      stuEls.forEach(el => {
        const r = namePool[Math.floor(Math.random() * namePool.length)];
        el.querySelector('.name').textContent = r;
      });
    }, 100);

    resultsEl.innerHTML = '';

    setTimeout(() => {
      clearInterval(nameTimer);
      stuEls.forEach(el => {
        el.classList.remove('shaking');
        const n = parseInt(el.dataset.n, 10);
        const s = STUDENTS.find(x => x.n === n);
        el.querySelector('.name').textContent = s.name;
      });
      ddoogu.classList.remove('show');

      const groups = distribute(pool, planSizes(pool.length, maxSize));
      renderResults(groups);

      setDrawing(false);
      drawBtn.disabled = false;
      drawBtn.textContent = '다시 뽑기';
    }, 2200);
  });

  updateHeader();
</script>
</body>
</html>
